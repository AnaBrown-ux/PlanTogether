<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="author" content="Salsabila Abu, Spencer Xu, Ruyan Li, Ana Moreno">
  <meta name="description" content="PlanTogether - a group activity planning app">
  <link rel="icon" href="draft-1/img/schedule_icon.png">
  <title>PlanTogether</title>
  <link rel="stylesheet" href="draft-1/css/style.css">
</head>
<body>

  <!-- Top Bar -->
  <header class="top-bar">
    <div class="logo">PlanTogether</div>
    <button class="signup-btn">Sign Up</button>
  </header>

  <!-- Main Dashboard -->
  <main class="dashboard">

    <!-- Toggle between views -->
    <div class="view-toggle">
      <a href="index.html" class="board-btn active">Board</a>
      <a href="draft-1/calendar.html" class="calendar-btn">Calendar</a>
      <a href="draft-1/invite.html" class="invite-btn">Invite</a>
    </div>

    <!-- Collaboration Board -->
    <section class="board-section">
      <div class="board-card">
        <h2 class="board-title">Weekend Plans</h2>
        <div class="activity-grid">

          <div class="activity-card">
            <img src="img/rattlesnake-ledge.jpg" alt="Hiking trip">
            <h3 class="activity-title"><a href="draft-1/activity-details-discussion.html">Hiking</a></h3>
            <p class="activity-time">Sunday, 10 AM</p>
            <div class="votes">
              <button class="vote-up" aria-label="Upvote Hiking (currently 5 upvotes)">👍 5</button>
              <button class="vote-down" aria-label="Downvote Hiking (currently 1 downvote)">👎 1</button>
            </div>
          </div>

          <div class="activity-card">
            <img src="img/beach.jpeg" alt="Beach Trip">
            <h3 class="activity-title">Beach Trip</h3>
            <p class="activity-time">Saturday, 2 PM</p>
            <div class="votes">
              <button class="vote-up" aria-label="Upvote Beach Trip (currently 8 upvotes)">👍 8</button>
              <button class="vote-down" aria-label="Downvote Beach Trip (currently 2 downvotes)">👎 2</button>
            </div>
          </div>

          <div class="activity-card">
            <img src="img/daveshotchicken.jpeg" alt="Dave's Hot Chicken Restaurant">
            <h3 class="activity-title">Dave's Hot Chicken</h3>
            <p class="activity-time">Friday, 6 PM</p>
            <div class="votes">
              <button class="vote-up" aria-label="Upvote Dave's Hot Chicken (currently 10 upvotes)">👍 10</button>
              <button class="vote-down" aria-label="Downvote Dave's Hot Chicken (currently 0 downvotes)">👎 0</button>
            </div>
          </div>

        </div>
        <a href="draft-1/add-activity.html" class="add-btn">+ Add Activity</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Group Planner &middot; INFO 340 Project</p>
    <p>Contact: <a href="mailto:groupplanner@uw.edu">groupplanner@uw.edu</a></p>
  </footer>
</body>
</html>
